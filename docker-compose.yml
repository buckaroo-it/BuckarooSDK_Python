services:
  # Development container - keeps running for interactive development
  dev:
    image: python:3.14-alpine3.21
    container_name: buckaroo-python-sdk-dev
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    command: sh -c "pip install --root-user-action=ignore -r requirements-dev.txt && tail -f /dev/null"  # Install dev requirements then keep running
    tty: true
    stdin_open: true
    networks:
      - develop
networks:
    develop:
        name: 'develop'
        external: true
