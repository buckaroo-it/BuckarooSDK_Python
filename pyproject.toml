[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.coverage.run]
source = ["buckaroo"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.paths]
source = ["buckaroo", "*/buckaroo"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["examples", "plans"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
